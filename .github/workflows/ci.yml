name: Validate release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node --check host.js
      - run: node --check client.js
      - run: npm ci --ignore-scripts
      - run: node scripts/check-dependencies.mjs . --pinned-toolchain
      - run: npm test
  engine-patch:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Verify pinned upstream and patch
        run: |
          git clone --no-checkout https://github.com/ranxianglei/billion-context.git .engine
          git -C .engine checkout --detach daa082ead8a8ead60311e29ad4627bff0f569fc1
          git -C .engine apply --check ../patches/billion-context-v0.1.212.patch
          git -C .engine apply ../patches/billion-context-v0.1.212.patch
      - run: npm ci --ignore-scripts
        working-directory: .engine
      - run: node scripts/check-dependencies.mjs .engine --sqlite --pinned-toolchain --engine-version=0.1.212
      - run: npm run typecheck
        working-directory: .engine
      - run: npm run build
        working-directory: .engine
      - run: node --import tsx --test tests/collaborative-transaction.test.ts tests/external-summary-runtime.test.ts tests/search-original-evidence.test.ts tests/search-evidence-cache.test.ts tests/search-context-cross-session.test.ts tests/search-plan-aware.test.ts tests/search-index.test.ts tests/search-index-integration.test.ts tests/search-index-dist.test.ts tests/search-index-resume.test.ts tests/search-index-progress.test.ts tests/check-dist-external.test.ts tests/search-fts-acceptance.test.ts tests/ccr-plugin.test.ts
        working-directory: .engine
      - run: node --import tsx --test tests/dsh-native.test.ts
        working-directory: .engine
      - run: npm ci --ignore-scripts
      - run: node scripts/check-dependencies.mjs . --pinned-toolchain
      - name: Run the feedback loop through its HTTP endpoints
        env:
          COLLAB_TEST_ENGINE: ${{ github.workspace }}/.engine
        run: node --test test/replay-feedback-host.test.js test/open-policy-host.test.js test/harvest-host.test.js test/harvest-privacy-host.test.js test/calibration-resume-host.test.js test/calibration-lifecycle-host.test.js
